tags:
  - name: Register a User

parameters:
  - in: body
    name: body
    description: User registration payload
    required: true
    schema:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: john_doe
        email:
          type: string
          example: jane@gmail.com
        password:
          type: string
          example: lalala90

responses:
  200:
    description: User is registered successfully
    schema:
      type: object
      properties:
        id:
          type: integer
          example: 5
        username:
          type: string
          example: Nehemiah
        email:
          type: string
          example: jane@gmail.com